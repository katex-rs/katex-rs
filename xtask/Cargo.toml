[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Build and development utilities for the katex-rs project"

[dependencies]
color-eyre = "0.6.5"
camino = "1.2.5"
clap = { version = "4.6.6", features = ["derive"] }
axum = "0.8.9"
image = "0.25.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thirtyfour = { version = "0.37.5", default-features = false, features = ["reqwest", "rustls", "cdp"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "fs"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
url = "2.5.8"
futures = "0.3.34"
strum_macros = "0.28.0"
atty = "0.2.14"
indicatif = "0.18.6"
console = "0.16.4"
json5 = "1.3.1"
regex = "1.13.1"

[lints]
workspace = true
