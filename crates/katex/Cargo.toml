[package]
name = "katex-rs"
readme = "../../README.md"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "A Rust implementation of KaTeX - Fast math typesetting for anywhere, more than just the web."
categories = ["mathematics", "wasm", "parsing"]
keywords = ["latex", "math", "katex", "wasm", "parsing"]
include = [
    "../../LICENSE",
    "../../README.md",
    "build.rs",
    "data/**",
    "src/**/*.rs",
    "benches/**",
    "tests/**",
    "utils/**",
]

[lib]
name = "katex"

[dependencies]
# Core dependencies
thiserror = "2.0.20"
phf = { version = "0.14.0", features = ["macros"] }
strum_macros = "0.28.0"
strum = { version = "0.28.0", features = ["derive"] }
bon = "3.10.0"
rapidhash = "4.5.1"

# WebAssembly support
wasm-bindgen = { version = "0.2.128", optional = true }
js-sys = { version = "0.3.105", optional = true }
web-sys = { version = "0.3.105", features = ["Document", "DocumentFragment", "Node", "Element", "Window", "Text"], optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

[features]
default = []
backtrace = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:console_error_panic_hook"]

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "perf_gungraun"
harness = false

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-normalization = "0.1.25"
phf = { version = "0.14.0", features = ["macros"] }
phf_codegen = "0.14.0"

[dev-dependencies]
btparse = "0.2.0"
wasm-bindgen-test = "0.3.78"
gungraun = "0.19.4"
criterion = { version = "0.8.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = { version = "0.9.34" }
regex = "1.13.1"
insta = { version = "1.48.0", features = ["glob"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gag = "1.0.0"

[lints]
workspace = true
